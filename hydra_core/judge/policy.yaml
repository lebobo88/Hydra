# Hydra judge policy (built-in defaults).
#
# Override per-project by placing a `.hydra/judge_policy.yaml` at the workflow
# project root. Unknown keys are ignored; missing keys fall back to these defaults.

# REFERENCE ONLY — NOT parsed by load_policy(). The authoritative tier-by-type
# logic lives in router.py (`_BASE_TIER_BY_TYPE` + the `_has_passing_pp_verdict`
# short-circuit that implements the `skip_if_pp_judged` semantic). This block is
# kept as documentation of intent; editing it changes nothing. `skip_if_pp_judged`
# is NOT a valid JudgeTier literal (cross_vendor|same_vendor|skip) — do not feed
# it to JudgeRoute.tier.
default_tier_by_envelope:
  C_SUITE_DECISION_PACKET: cross_vendor
  CREATIVE_BRIEF: same_vendor
  SHOT_LIST: same_vendor
  ASSET_JOB: same_vendor
  PRD: skip_if_pp_judged
  ARCH_RFC: skip_if_pp_judged
  DEV_TASK: skip_if_pp_judged
  HITL_REQUEST: cross_vendor
  DECISION_RECORD: same_vendor
  HANDOFF: same_vendor

escalation_keywords:
  - capital_allocation
  - merger
  - acquisition
  - crisis
  - black_swan
  - phi
  - hipaa
  - gdpr
  - constitution
  - production_deploy

# (generator, judge) allowed pairs — judge must differ from generator for
# cross_vendor. NOT YET parsed/enforced by load_policy (tracked: Phase-2
# hardening / F1-vendor-rule). Gemini retired (2026-06) so the live pair is
# (claude, codex); (codex, codex) is same-vendor-degraded fallback only.
vendor_pairs:
  - [claude, codex]
  - [codex, codex]   # same-vendor degraded fallback (no host Claude producer)

# Per-workflow tripwire. When the running judge cost exceeds this, the
# dispatcher downgrades cross_vendor → single_vendor (Phase-2 hook).
budget_cap_per_workflow_usd: 2.50

# Phase gating: turn judges on only for these squads in Phase 1/2. Other squads
# get the supervisor wiring but no real judge call.
enabled_squads:
  - executive
  - garland
  - healthcare
  - legal-compliance
  - rlm-gaming

# Severity escalation: rubrics that trigger HITL on `fail` outcome.
hitl_on_fail:
  - constitution-alignment@1
  - phi-redaction-completeness@1
  - financial-hardcoding@1
  # arcade (rlm-gaming) — the human-approval gates from squads/rlm-gaming/squad.yaml
  - loot-box-jurisdiction@1
  - esrb-pegi-iarc-rating@1
  - platform-cert-readiness@1
  - server-authority-fairplay@1
  - ai-content-provenance@1
