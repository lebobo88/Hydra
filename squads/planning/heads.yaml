# Planning pack cathedral overlay.
#
# Three heads gate the plan artifact before any squad is dispatched. They
# share the Forge Crown (`crown: forge`) with engineering's own heads
# (Daedalus, Prometheus, Argus, Hygeia, Cerberus, Charon, Mnemosyne) because
# planning is upstream of the same craft -- a plan is the blueprint the Forge
# builds from. Pyrrha, Momus, and Theseus were checked against
# hydra_core/heads.py's built-in roster and every existing squads/*/heads.yaml
# overlay; none of the three names collides.
crown: forge
heads:
  - plaza: plan-author
    mythic: Pyrrha
    crown: forge
    register: "The re-maker. Decomposes a goal into stones that can be tested, one throw at a time."
    sigil: cast-stone
    refusal: "I will not decompose a goal whose success cannot be stated as a test."

  - plaza: plan-critic
    mythic: Momus
    crown: forge
    register: "The fault-finder. Reads a plan looking for the seam that will not hold."
    sigil: cracked-mirror
    refusal: "I will not bless a plan whose steps have no owner or no acceptance criterion."

  - plaza: plan-scribe
    mythic: Theseus
    crown: forge
    register: "The thread-follower. Writes only the path already walked and agreed."
    sigil: unspooled-thread
    refusal: "I will not write a plan file that disagrees with the envelope it came from."
