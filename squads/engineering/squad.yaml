name: Engineering & Product
version: 1.0.0
deprecated_after: null   # ISO date or null; Iolaus refuses dispatch on/after this date
description: >
  Software engineering, product management, architecture, QA, DevOps. Wired to
  the pair-programmer harness — Hydra dispatches Engineering work as PP runs
  (single, best-of, team-mode, or governance-forum review).
source_pack: https://github.com/lebobo88/pair-programmer
entrypoint: mcp
industries: [software, saas, ai-platform, devtools, fintech-eng, healthtech-eng]

agents:
  - slug: pm-agent
    role: "Product manager — turns CSuiteDecisionPacket into PRD"
    authority: advisory
  - slug: architect
    role: "System architect — produces ARCH_RFC, C4 sketches"
    authority: advisory
  - slug: engineer
    role: "Implementation engineer — feature-branch PRs only"
    authority: execute
  - slug: qa-reviewer
    role: "QA + code reviewer — tests, lint, security scans"
    authority: gatekeeper
  - slug: devops-sre
    role: "DevOps & SRE — proposes infra/CI; prod deploy requires HITL"
    authority: gatekeeper

tools:
  # RBAC matching rule (hydra_core/dispatcher.py:_check_tool_rbac): for a live
  # call to (server, tool) the dispatcher builds tool_key = f"{server}.{tool}"
  # and authorizes a declared tool when EITHER:
  #   (a) `name` == tool_key  — the exact dotted key, e.g. "pp_harness.start_run"
  #       (note: underscore server segment, since server is "pp_harness"), OR
  #   (b) `name` == bare tool AND (`mcp_server` is absent or == server).
  # We use form (b) — bare names + an explicit `mcp_server`. The historical
  # "pp.harness.start_run" form matched NEITHER (its server segment "pp.harness"
  # uses a dot, not the underscore of the real server "pp_harness"), so live
  # dispatch was RBAC-rejected. Keep these bare. Every tool the live drive loop
  # in squad_node._via_mcp calls (start_run, ensure_agents_md, start_stage,
  # archive_artifact, record_attempt, record_verdict, record_smoke_status,
  # finalize_stage, finalize_run on pp_harness; generate on pp_codex;
  # critique on pp_gemini)
  # MUST be declared here or RBAC rejects it mid-run.
  - name: start_run
    mcp_server: pp_harness
    privilege: execute
    notes: >
      Start a pair-programmer run (single/team/best-of/review mode).
      Use for: initiating engineering work dispatched by Hydra.
      Not for: read-only queries or status checks.
  - name: ensure_agents_md
    mcp_server: pp_harness
    privilege: write
    notes: >
      Scaffold the AGENTS.md/CLAUDE.md contract create-if-absent at run start.
      Use for: ensuring the repo-level agent contract exists before PP work runs.
      Not for: editing an existing contract body in place.
  - name: finalize_run
    mcp_server: pp_harness
    privilege: execute
    notes: >
      Finalize (or abort) an active PP run; releases the project lock.
      Use for: cleanup/teardown of an open run on completion or abort.
      Not for: starting a run — use start_run instead.
  - name: start_stage
    mcp_server: pp_harness
    privilege: execute
    notes: >
      Start a specific stage within an active PP run.
      Use for: advancing through taxonomy stages (spec, design, code, test).
      Not for: starting a new run — use start_run instead.
  - name: archive_artifact
    mcp_server: pp_harness
    privilege: write
    notes: >
      Archive a produced artifact to the run's .harness directory.
      Use for: persisting spec/design/code/test artifacts after generation.
      Not for: reading or listing existing artifacts.
  - name: record_attempt
    mcp_server: pp_harness
    privilege: write
    notes: >
      Record a generation attempt against a stage (producer, model, tokens/cost,
      retry index, parent attempt). Returns the attempt_id used by record_verdict
      and finalize_stage. Use for: logging each drive-loop generation.
      Not for: scoring — that is record_verdict.
  - name: record_verdict
    mcp_server: pp_harness
    privilege: write
    notes: >
      Record a judge verdict (pass/revise/fail + critique + score) against an
      attempt. Use for: persisting the cross-vendor critique result in the
      drive loop. Not for: producing the critique — that is the gemini/codex
      critique tool.
  - name: finalize_stage
    mcp_server: pp_harness
    privilege: execute
    notes: >
      Close a stage (passed/surfaced/skipped). A "passed" status requires
      winner_attempt_id. Use for: completing a stage in the drive loop before
      finalize_run. Not for: closing the whole run — use finalize_run.
  - name: record_smoke_status
    mcp_server: pp_harness
    privilege: write
    notes: >
      Record the real runtime smoke result for the winning candidate slot
      (pass/fail/infra_error/skipped). Required by PP-VG-5 before finalize_stage
      can mark a code stage passed. Use for: persisting the drive loop's
      independent smoke verdict. Not for: scoring — that is record_verdict.
  - name: generate
    mcp_server: pp_codex
    privilege: execute
    notes: >
      Generate code or artifacts via OpenAI Codex.
      Use for: code generation when cross-vendor diversity is needed.
      Not for: critique/review — use the gemini critique tool instead.
  - name: critique
    mcp_server: pp_gemini
    privilege: execute
    notes: >
      Judge/critique artifacts via Google Gemini.
      Use for: cross-vendor review of generated artifacts.
      Not for: code generation — use the codex generate tool instead.
  - name: blender
    mcp_server: blender
    privilege: read
    notes: >
      The existing blender-mcp backend (socket :9876 / bridge :7700), registered in
      hydra_core/gateway_templates.json. Engineering uses it READ/VALIDATE-only — the
      tech-animator / technical-artist inspect and validate garland's exported 3D rig/
      mesh assets against dcc-asset-validation@1 (engine-import correctness). 3D asset
      EXECUTION is garland's blender-model/blender-rig, not engineering.

accepts:
  - PRD
  - ARCH_RFC
  - DEV_TASK
  - HANDOFF

emits:
  - PRD
  - ARCH_RFC
  - DEV_TASK
  - DECISION_RECORD

gates:
  - rubric_id: owasp-asvs-l1
    hitl_required: false
  - rubric_id: rfc-2119-normative
  - rubric_id: openapi-3.1-stability
  - rubric_id: slsa-l2
    hitl_required: false
    when: "phase == 'release'"

invoke:
  mode: pp_best_of                   # one of: pp_run | pp_team | pp_best_of | pp_review  (set to pp_best_of: Claude producer writes files locally; codex is sandboxed off the local repo this env)
  default_team: feature-team
  forum_for_review: change-advisory-board
  project_path: "${project_root}"
  command_hint: "/pp:run"
  # WS9: optional model_tier for this squad's default dispatch.
  # Valid tokens: haiku | sonnet | opus | fable | deep
  # "fable" and "deep" are aliases — both route to pp's deep-reasoning-team
  # (cross-vendor judges per WS6). Leave null/absent to use pp's own default.
  # IMPORTANT: Fable is operator/flag-driven only — Hydra does NOT auto-escalate
  # to Fable on retry or budget events. Set this only when the operator explicitly
  # wants every engineering dispatch from this squad to use the deep-reasoning-team.
  model_tier: ~                      # null — use pp default; override per-workflow via dispatch envelope
